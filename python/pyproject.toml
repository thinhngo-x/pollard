[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pollard-vcs"
version = "0.1.0"
description = "Tree-based experiment version control (bundles the pollard/po binaries)"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }

[project.optional-dependencies]
pandas = ["pandas"]
wandb = ["wandb"]
neptune = ["neptune"]

[tool.maturin]
# The wheel ships the Rust `pollard` and `po` binaries plus the pure-Python `pollard` package.
bindings = "bin"
manifest-path = "../crates/pollard-cli/Cargo.toml"
python-source = "src"
module-name = "pollard"
