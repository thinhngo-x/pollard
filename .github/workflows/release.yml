name: Release

# Runs only on a version tag push - never on plain pushes to main, so it can't fire by accident.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the built wheel to PyPI (default: build only)"
        type: boolean
        default: false

permissions:
  contents: write # needed to create the draft GitHub release and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    # x86_64-unknown-linux-gnu only for now (this machine's target, and SPEC.md §11 rules out
    # Windows for v1). macOS/arm64 builds are a follow-up once we have runner coverage for them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czf pollard-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz pollard po

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: target/x86_64-unknown-linux-gnu/release/pollard-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

  build-wheel:
    # Built inside the official manylinux container via maturin-action, not on the bare
    # runner: that's what earns a manylinux_* wheel tag PyPI will actually accept, since a
    # wheel built on ubuntu-latest's own glibc gets a plain (rejected) "linux_x86_64" tag.
    # musllinux (Alpine) is a follow-up, not covered here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: x86_64
          manylinux: auto
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: python/dist/*

  publish-pypi:
    needs: build-wheel
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist

      - name: Publish to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: pipx run maturin upload --skip-existing dist/*

  release:
    needs: [build-binaries, build-wheel]
    if: startsWith(github.ref, 'refs/tags/v') # skip on a manual workflow_dispatch test run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: true # publish manually once someone has reviewed the notes
          files: |
            artifacts/linux-binaries/*
            artifacts/python-wheel/*

  # PyPI publish is automated above (publish-pypi), using the manylinux wheel this workflow
  # builds. crates.io publish is still a manual `cargo publish` step per docs/RELEASE.md: it
  # must run once per crate in dependency order (objects -> git/remote -> core -> cli), which
  # doesn't fit a single CI job well, and CARGO_REGISTRY_TOKEN is configured for a future job
  # if that changes.
