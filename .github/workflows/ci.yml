name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Linux only: SPEC.md §11 lists Windows support as an explicit v1 non-goal, and there's
    # no macOS runner budget yet either. Revisit if that changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # M5 (uv integration) and the journey tests shell out to a real `uv`, not just the
      # `python` job's build - without this, `cargo test` fails with "uv: command not found".
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace

      # The one #[ignore]d test (a 1000-node timing budget) only holds in --release; it's
      # not run here to keep CI fast and non-flaky, and gets checked separately pre-release.
      - name: cargo test
        run: cargo test --workspace

  msrv:
    # Builds on the rust-version declared in Cargo.toml; the rust job uses latest stable,
    # which can't catch a dependency that needs a newer compiler than we promise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build (MSRV)
        run: cargo build --workspace --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        # maturin (bindings = "bin") compiles the pollard-cli binary, so the wheel build
        # needs a Rust toolchain too.

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      # No tests under python/ yet (only python/src/pollard) - just verify the wheel builds.
      # Add a `uv run pytest` step here once python/tests exists.
      - name: uv build
        working-directory: python
        run: uv build
