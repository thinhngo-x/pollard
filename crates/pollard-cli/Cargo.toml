[package]
name = "pollard-cli"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "pollard"
path = "src/main.rs"

[[bin]]
name = "po"
path = "src/main.rs"

[dependencies]
pollard-core = { path = "../pollard-core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
