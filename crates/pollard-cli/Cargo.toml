[package]
name = "pollard-cli"
description = "pollard / po: tree-based experiment version control, command-line interface."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
pollard-core = { version = "0.2.0-alpha.1", path = "../pollard-core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
