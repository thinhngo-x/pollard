[package]
name = "pollard-core"
description = "Core commands and repo logic for pollard: node model, op log, deltas, siblings, metrics, run protocol."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
pollard-objects = { version = "0.1.0-alpha.1", path = "../pollard-objects" }
pollard-git = { version = "0.1.0-alpha.1", path = "../pollard-git" }
pollard-remote = { version = "0.1.0-alpha.1", path = "../pollard-remote" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
blake3 = "1"
thiserror = "2"
ignore = "0.4"
fs4 = { version = "0.13", features = ["sync"] }
ctrlc = { version = "3", features = ["termination"] }
diffy = "0.5"
zstd = "0.14"

[dev-dependencies]
tempfile = "3"
