[package]
name = "pollard-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
pollard-objects = { path = "../pollard-objects" }
pollard-git = { path = "../pollard-git" }
pollard-remote = { path = "../pollard-remote" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
blake3 = "1"
thiserror = "2"
ignore = "0.4"
fs4 = { version = "0.13", features = ["sync"] }
ctrlc = { version = "3", features = ["termination"] }
diffy = "0.4"
zstd = "0.14"

[dev-dependencies]
tempfile = "3"
