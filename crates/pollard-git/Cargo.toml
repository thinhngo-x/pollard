[package]
name = "pollard-git"
description = "Git interop for pollard: tree hashing, import and export via gix."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
gix = { version = "0.87.1", default-features = false, features = ["sha1", "revision"] }
pollard-objects = { version = "0.1.0-alpha.1", path = "../pollard-objects" }
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"
