[package]
name = "pollard-objects"
description = "Content-addressed object store and CDC chunking for pollard."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
blake3 = "1.8.7"
fastcdc = "5.0"
ignore = "0.4.30"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
zstd = "0.14.0"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
